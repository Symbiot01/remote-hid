# Laptop proof-of-concept only. Production Coolify uses docker-compose.yml
# (external network "coolify", HTTP 8889 not published on the host).
services:
  mediamtx:
    build: .
    image: web-hid-mediamtx:local
    container_name: lookcam-mtx
    restart: unless-stopped
    ports:
      - "8889:8889"
      - "8189:8189/udp"
      - "8890:8890/udp"
      - "8554:8554"
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${MTX_WEBRTCADDITIONALHOSTS:-127.0.0.1}
